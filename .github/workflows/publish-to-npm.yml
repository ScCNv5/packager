name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tw-packager
    steps:
      - uses: actions/checkout@v6
        with:
          path: tw-packager
          persist-credentials: false
      - uses: ./tw-packager/.github/actions/setup-specialized
        with:
          vm-ref: ${{ vars.SPECIALIZED_VM_REF }}
      - run: npm publish

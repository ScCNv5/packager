name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tw-packager
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        path: tw-packager
    - uses: ./tw-packager/.github/actions/setup-specialized
      with:
        vm-ref: ${{ vars.SPECIALIZED_VM_REF }}
    - name: Build
      run: npm run build-node-prod
    - name: Test
      run: |
        npm test -- --runInBand
        npm run test:specialized
        node test/specialized-differential.mjs --linked
        npm run test:specialized-aggressive
        npm run test:specialized-build
        node test/specialized-worker-input.mjs
        npx playwright install --with-deps chromium firefox webkit
        npm run test:specialized-browser
        node test/specialized-build.mjs --aggressive
        node test/specialized-worker-input.mjs --aggressive
        npm run test:specialized-browser
        npm run test:specialized-performance
    - name: Build standalone
      run: npm run build-standalone-prod
    - name: Test offline standalone
      run: node test/specialized-standalone.mjs
    - name: Upload standalone artifact
      uses: actions/upload-artifact@v6
      with:
        name: standalone
        path: tw-packager/dist/standalone.html
